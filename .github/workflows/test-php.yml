# eustasy/.Normal 4.0beta16
name: "Test: PHP"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.php"
      - "tests/**"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml"
      - "phpunit.xml.dist"
      - ".github/workflows/test-php.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.php"
      - "tests/**"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml"
      - "phpunit.xml.dist"
      - ".github/workflows/test-php.yml"

permissions:
  contents: read

jobs:
  test-php:
    name: PHPUnit + coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3", "8.4", "8.5", "8.6"]
    services:
      mariadb:
        image: mariadb:12.3.2@sha256:f0b0a2b36cd621f919a7bbbff44d894aa274e3d32feecf032138557a483a6522
        env:
          MARIADB_ROOT_PASSWORD: phoenix_root
          MARIADB_DATABASE: phoenix
          MARIADB_USER: phoenix
          MARIADB_PASSWORD: phoenix_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: eustasy/.normal/php/setup@v4
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli, gd
          tools: composer:v2
          coverage: pcov

      - name: Configure Phoenix for tests
        run: |
          cat > config/phoenix.custom.php <<'EOF'
          <?php
          $settings['db_host']      = '127.0.0.1';
          $settings['db_user']      = 'phoenix';
          $settings['db_pass']      = 'phoenix_pass';
          $settings['db_name']      = 'phoenix';
          $settings['db_prefix']    = 'phoenix_';
          $settings['db_persist']   = false;
          $settings['db_reset']     = false;
          $settings['open_tracker'] = true;
          EOF

      - uses: eustasy/.normal/php/test@v4
        with:
          coverage-token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          upload: ${{ matrix.php-version == '8.6' }}

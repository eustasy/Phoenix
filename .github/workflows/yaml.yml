# eustasy/.Normal 4.0beta14
name: "Normal: YAML"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.yml"
      - "**.yaml"
      - ".qlty/qlty.toml"
  pull_request:
    branches: [main]
    paths:
      - "**.yml"
      - "**.yaml"
      - ".qlty/qlty.toml"

permissions:
  contents: read

jobs:
  yaml:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: eustasy/.normal/yaml@v4

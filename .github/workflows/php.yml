# eustasy/.Normal 4.0beta16
name: "Normal: PHP"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.php"
      - ".github/workflows/php.yml"
      - ".qlty/qlty.toml"
  pull_request:
    branches: [main]
    paths:
      - "**.php"
      - ".github/workflows/php.yml"
      - ".qlty/qlty.toml"

permissions:
  contents: read

jobs:
  php:
    name: Lint + format
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3", "8.4", "8.5", "8.6"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: eustasy/.normal/php@v4
        with:
          php-version: ${{ matrix.php-version }}
          extensions: gd

# eustasy/.Normal 5.0
# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions-patching:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "monthly"
    # Add new majors to a constraint rather than replacing it: phpunit is
    # "^11.0 || ^12.0 || ^13.0" so each PHP version in the test matrix resolves
    # the newest major it can run, and a replaced constraint drops PHP 8.2.
    versioning-strategy: widen
    allow:
      - dependency-type: "all"
    groups:
      composer-patching:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "monthly"
    groups:
      docker-patching:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      docker-compose-patching:
        update-types:
          - "minor"
          - "patch"
